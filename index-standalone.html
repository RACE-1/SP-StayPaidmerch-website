<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAYPAID MERCH — High-Velocity Street Luxury</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <!-- Google Fonts: Inter, Playfair Display Italic, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#0D0D12',
            champagne: '#C9A84C',
            ivory: '#FAF8F5',
            slateDark: '#2A2A35',
            surface: '#16161F',
            surfaceBorder: 'rgba(255, 255, 255, 0.08)'
          },
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          borderRadius: {
            '2rem': '2rem',
            '2.5rem': '2.5rem',
            '3rem': '3rem',
            '4rem': '4rem',
          }
        }
      }
    }
  </script>
  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #0D0D12;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    /* Global SVG Noise Texture Overlay at 0.05 Opacity */
    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
    .btn-magnetic {
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.35s ease;
    }
    .btn-magnetic:hover { transform: scale(1.03); }
    .btn-magnetic:active { transform: scale(0.98); }
    .btn-slide-hover {
      position: relative;
      overflow: hidden;
      z-index: 1;
    }
    .btn-slide-hover .slide-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      z-index: -1;
    }
    .btn-slide-hover:hover .slide-bg { transform: translateY(0); }
    .interactive-lift {
      transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94), color 0.2s ease;
    }
    .interactive-lift:hover { transform: translateY(-1px); }
  </style>
</head>
<body class="bg-[#0D0D12] text-[#FAF8F5] antialiased selection:bg-[#C9A84C] selection:text-[#0D0D12]">
  <div class="noise-overlay"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    gsap.registerPlugin(ScrollTrigger);

    const PRODUCTS = [
      {
        id: 'sp-01',
        name: 'Syndicate 500GSM Heavyweight Hoodie',
        category: 'Heavyweight Fleece',
        price: 88,
        tag: 'Drop 01 Flagship',
        image: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?q=80&w=1000&auto=format&fit=crop',
        description: 'Custom milled 500 GSM loopback cotton. Pre-shrunk architectural box cut with double-needle reverse stitching.',
        sizes: ['S', 'M', 'L', 'XL']
      },
      {
        id: 'sp-02',
        name: 'Atelier Raw Wide-Leg Carpenter Pant',
        category: 'Tailored Streetwear',
        price: 115,
        tag: 'Limited Run',
        image: 'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=1000&auto=format&fit=crop',
        description: '14oz deadstock Japanese raw denim. Double knee structural overlays and custom gunmetal stay-paid rivets.',
        sizes: ['30', '32', '34', '36']
      },
      {
        id: 'sp-03',
        name: 'Architectural Boxy Vintage Crewneck Tee',
        category: 'Daily Essential',
        price: 46,
        tag: 'Core Uniform',
        image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=1000&auto=format&fit=crop',
        description: '280 GSM long-staple combed cotton with blind hem finish and tight ribbed collar that will never bacon.',
        sizes: ['S', 'M', 'L', 'XL']
      },
      {
        id: 'sp-04',
        name: 'Tactical Weatherproof Ripstop Shell',
        category: 'Technical Outerwear',
        price: 165,
        tag: 'All-Conditions',
        image: 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=1000&auto=format&fit=crop',
        description: 'Three-layer waterproof breathable membrane with AquaGuard seam sealing and dual-direction magnetic utility pulls.',
        sizes: ['M', 'L', 'XL']
      }
    ];

    function App() {
      const containerRef = useRef(null);
      const heroRef = useRef(null);
      const navbarRef = useRef(null);
      const preloaderRef = useRef(null);
      const mascotPreloadRef = useRef(null);

      const [isLoading, setIsLoading] = useState(true);
      const [loadProgress, setLoadProgress] = useState(80);

      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [orderModalOpen, setOrderModalOpen] = useState(false);
      const [orderSuccess, setOrderSuccess] = useState(false);
      const [selectedSizes, setSelectedSizes] = useState({
        'sp-01': 'L',
        'sp-02': '32',
        'sp-03': 'L',
        'sp-04': 'M'
      });

      const [shufflerCards, setShufflerCards] = useState([
        { id: 1, title: 'Silhouette 01: Boxy Heavy Fleece', spec: '500 GSM French Terry Loopback', resonance: '98.9% Runway Resonance', batch: 'Batch SP-449' },
        { id: 2, title: 'Silhouette 02: Wide Leg Carpenter', spec: '14oz Raw Deadstock Kuroki Denim', resonance: '96.4% Architecture Rating', batch: 'Batch SP-812' },
        { id: 3, title: 'Silhouette 03: Sculptural Supima Tee', spec: '280 GSM Single Jersey Cold Wash', resonance: '99.2% Uniform Consistency', batch: 'Batch SP-103' }
      ]);

      const telemetryFullText = `[PRICING TELEMETRY // REAL-TIME DISPATCH]
Direct-from-mill raw sourcing: -42% retail markup eliminated.
Cost breakdown per garment:
  • Raw Cotton Fibers: $14.20
  • Organic Eco-Dye & Wash: $4.80
  • Structural Hardware: $3.10
  • Fair-Wage Atelier Labor: $16.50
  • Direct Logistics: $5.40
True Production Cost: $44.00 | StayPaid Price: $88.00 (Traditional Retail: $280.00).
Status: 100% Value Transparency Verified.`;
      const [typewriterText, setTypewriterText] = useState('');

      const daysOfWeek = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const [activeDayIndex, setActiveDayIndex] = useState(3);
      const [isDaySaved, setIsDaySaved] = useState(false);

      const addToCart = (product) => {
        const size = selectedSizes[product.id] || product.sizes[0];
        const existingIndex = cart.findIndex(item => item.id === product.id && item.size === size);
        if (existingIndex > -1) {
          const updated = [...cart];
          updated[existingIndex].quantity += 1;
          setCart(updated);
        } else {
          setCart([...cart, { ...product, size, quantity: 1 }]);
        }
        setIsCartOpen(true);
      };

      const updateQuantity = (index, delta) => {
        const updated = [...cart];
        updated[index].quantity += delta;
        if (updated[index].quantity <= 0) {
          updated.splice(index, 1);
        }
        setCart(updated);
      };

      const cartTotal = cart.reduce((acc, item) => acc + item.price * item.quantity, 0);

      useEffect(() => {
        const interval = setInterval(() => {
          setShufflerCards(prev => {
            const next = [...prev];
            const last = next.pop();
            next.unshift(last);
            return next;
          });
        }, 3200);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        let currentIdx = 0;
        let forward = true;
        let timeoutId;
        const tick = () => {
          if (forward) {
            if (currentIdx <= telemetryFullText.length) {
              setTypewriterText(telemetryFullText.slice(0, currentIdx));
              currentIdx += 2;
              timeoutId = setTimeout(tick, 35);
            } else {
              timeoutId = setTimeout(() => {
                forward = false;
                tick();
              }, 4500);
            }
          } else {
            if (currentIdx > 0) {
              currentIdx -= 8;
              setTypewriterText(telemetryFullText.slice(0, Math.max(0, currentIdx)));
              timeoutId = setTimeout(tick, 20);
            } else {
              forward = true;
              timeoutId = setTimeout(tick, 600);
            }
          }
        };
        tick();
        return () => clearTimeout(timeoutId);
      }, []);

      useEffect(() => {
        let day = 1;
        const interval = setInterval(() => {
          day = (day + 1) % 7;
          setActiveDayIndex(day);
          setIsDaySaved(false);
          setTimeout(() => {
            setIsDaySaved(true);
          }, 1000);
        }, 2800);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const progressInterval = setInterval(() => {
          setLoadProgress(prev => {
            if (prev >= 100) {
              clearInterval(progressInterval);
              return 100;
            }
            return prev + 2;
          });
        }, 110);
        return () => clearInterval(progressInterval);
      }, []);

      useEffect(() => {
        const ctx = gsap.context(() => {
          if (mascotPreloadRef.current && preloaderRef.current) {
            const preloaderTl = gsap.timeline({
              onComplete: () => {
                gsap.to(preloaderRef.current, {
                  opacity: 0,
                  scale: 1.04,
                  duration: 0.8,
                  ease: 'power3.inOut',
                  onComplete: () => setIsLoading(false)
                });
              }
            });

            // Walking cycle: step bobbing and lateral weight shift
            gsap.to(mascotPreloadRef.current, {
              y: -12,
              rotation: 3,
              duration: 0.32,
              repeat: 5,
              yoyo: true,
              ease: 'sine.inOut'
            });

            // Forward stride: fades in & scales forward from 80% to 100%
            preloaderTl
              .fromTo(
                mascotPreloadRef.current,
                { opacity: 0.8, scale: 0.8 },
                {
                  opacity: 1,
                  scale: 1,
                  duration: 1.6,
                  ease: 'power2.out'
                }
              );
          }

          ScrollTrigger.create({
            trigger: '#hero-section',
            start: 'top top',
            end: 'bottom 100px',
            onLeave: () => {
              gsap.to(navbarRef.current, {
                backgroundColor: 'rgba(13, 13, 18, 0.85)',
                borderColor: 'rgba(255, 255, 255, 0.15)',
                boxShadow: '0 20px 40px -15px rgba(0,0,0,0.7)',
                backdropFilter: 'blur(20px)',
                duration: 0.4,
                ease: 'power2.inOut'
              });
            },
            onEnterBack: () => {
              gsap.to(navbarRef.current, {
                backgroundColor: 'rgba(13, 13, 18, 0.35)',
                borderColor: 'rgba(255, 255, 255, 0.08)',
                boxShadow: 'none',
                backdropFilter: 'blur(8px)',
                duration: 0.4,
                ease: 'power2.inOut'
              });
            }
          });

          const heroTl = gsap.timeline({ defaults: { ease: 'power3.out' } });
          heroTl
            .from('.hero-badge', { y: 30, opacity: 0, duration: 0.8, delay: 0.2 })
            .from('.hero-title-sans', { y: 40, opacity: 0, duration: 0.9 }, '-=0.5')
            .from('.hero-title-serif', { y: 45, opacity: 0, duration: 1.1 }, '-=0.6')
            .from('.hero-sub', { y: 30, opacity: 0, duration: 0.8 }, '-=0.7')
            .from('.hero-actions', { y: 30, opacity: 0, duration: 0.8 }, '-=0.6');

          gsap.from('.feature-card', {
            scrollTrigger: {
              trigger: '#features-section',
              start: 'top 75%'
            },
            y: 60,
            opacity: 0,
            duration: 0.9,
            stagger: 0.15,
            ease: 'power3.out'
          });

          gsap.from('.manifesto-reveal', {
            scrollTrigger: {
              trigger: '#manifesto-section',
              start: 'top 70%'
            },
            y: 40,
            opacity: 0,
            duration: 1,
            stagger: 0.12,
            ease: 'power3.out'
          });

          const protocolCards = gsap.utils.toArray('.protocol-stack-card');
          protocolCards.forEach((card, index) => {
            if (index < protocolCards.length - 1) {
              ScrollTrigger.create({
                trigger: card,
                start: 'top top',
                pin: true,
                pinSpacing: false,
                endTrigger: protocolCards[index + 1],
                end: 'top top',
                onUpdate: (self) => {
                  const progress = self.progress;
                  gsap.to(card, {
                    scale: 1 - progress * 0.1,
                    filter: `blur(${progress * 15}px)`,
                    opacity: 1 - progress * 0.5,
                    duration: 0.1,
                    ease: 'none',
                    overwrite: 'auto'
                  });
                }
              });
            }
          });
        }, containerRef);

        return () => ctx.revert();
      }, []);

      return (
        <div ref={containerRef} className="relative bg-[#0D0D12] text-[#FAF8F5] min-h-screen">
          {/* PRELOADER — White background, walking mascot with arms wide open, fading in from 80% to 100% */}
          {isLoading && (
            <div
              ref={preloaderRef}
              className="fixed inset-0 z-[99999] bg-white flex flex-col items-center justify-center pointer-events-auto select-none transition-colors"
            >
              {/* Subtle Studio Floor Lighting */}
              <div className="absolute w-[32rem] h-[32rem] rounded-full bg-gradient-to-tr from-amber-50/50 via-orange-50/30 to-transparent blur-3xl pointer-events-none" />

              {/* Mascot Figure Container — Walking with arms wide open */}
              <div
                ref={mascotPreloadRef}
                className="relative z-10 flex flex-col items-center"
                style={{ opacity: 0.8, transform: 'scale(0.8)' }}
              >
                <img
                  src="mascot-walk.jpg"
                  alt="StayPaid Mascot Walking with Arms Wide Open"
                  className="w-60 sm:w-72 md:w-80 h-auto object-contain drop-shadow-[0_20px_40px_rgba(0,0,0,0.12)]"
                />
              </div>

              {/* Loading Progress Bar & Counter (80% -> 100%) */}
              <div className="relative z-10 mt-6 flex flex-col items-center space-y-2.5">
                <div className="w-44 h-[3px] bg-neutral-200 rounded-full overflow-hidden shadow-inner">
                  <div
                    className="h-full bg-gradient-to-r from-[#0D0D12] via-[#C9A84C] to-[#E67E22] transition-all duration-150 rounded-full"
                    style={{ width: `${loadProgress}%` }}
                  />
                </div>
                <div className="flex items-center space-x-2 font-mono text-[11px] tracking-widest text-[#0D0D12]/75 uppercase font-semibold">
                  <span>STAYPAID ATELIER //</span>
                  <span className="text-[#C9A84C] font-bold">{loadProgress}%</span>
                </div>
              </div>
            </div>
          )}

          {/* NAVBAR */}
          <header
            ref={navbarRef}
            className="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-5xl rounded-full px-6 py-3.5 bg-[#0D0D12]/40 backdrop-blur-md border border-white/10 transition-all duration-300 flex items-center justify-between"
          >
            <a href="#hero-section" className="flex items-center space-x-2.5 group">
              <img
                src="logo.jpg"
                alt="StayPaid Logo"
                className="w-9 h-9 rounded-full object-cover border border-[#C9A84C]/40 shadow-lg group-hover:scale-105 transition-transform duration-300"
              />
              <div className="flex flex-col">
                <span className="font-sans font-black tracking-tight text-sm uppercase text-white">STAYPAID</span>
                <span className="font-mono text-[9px] uppercase tracking-widest text-[#FAF8F5]/40 -mt-1">Atelier Merch</span>
              </div>
            </a>

            <nav className="hidden md:flex items-center space-x-8 text-xs font-medium tracking-wider uppercase text-[#FAF8F5]/70">
              <a href="#collection-section" className="interactive-lift hover:text-white">Collection</a>
              <a href="#features-section" className="interactive-lift hover:text-white">Artifacts</a>
              <a href="#manifesto-section" className="interactive-lift hover:text-white">Manifesto</a>
              <a href="#protocol-section" className="interactive-lift hover:text-white">Protocol</a>
              <a href="#membership-section" className="interactive-lift hover:text-white">Membership</a>
            </nav>

            <div className="flex items-center space-x-3">
              <button
                onClick={() => setIsCartOpen(true)}
                className="btn-magnetic relative p-2.5 rounded-full bg-white/5 border border-white/10 hover:border-[#C9A84C]/50 hover:bg-white/10"
              >
                <svg className="w-4 h-4 text-[#FAF8F5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                {cart.length > 0 && (
                  <span className="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-[#C9A84C] text-[#0D0D12] font-mono text-[10px] font-bold flex items-center justify-center">
                    {cart.reduce((total, item) => total + item.quantity, 0)}
                  </span>
                )}
              </button>

              <a
                href="#collection-section"
                className="btn-magnetic btn-slide-hover hidden sm:inline-flex items-center space-x-2 px-5 py-2.5 rounded-full bg-[#C9A84C] text-[#0D0D12] font-semibold text-xs tracking-wider uppercase"
              >
                <span className="slide-bg bg-white" />
                <span className="relative z-10">Shop Drop 01</span>
                <span className="relative z-10">↗</span>
              </a>
            </div>
          </header>

          {/* HERO */}
          <section id="hero-section" ref={heroRef} className="relative h-[100dvh] w-full flex flex-col justify-end overflow-hidden pb-16 md:pb-24 px-6 md:px-16">
            <div className="absolute inset-0 z-0">
              <img
                src="https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1920&auto=format&fit=crop"
                alt="StayPaid High-Fashion Editorial"
                className="w-full h-full object-cover object-top opacity-55 scale-105"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-[#0D0D12] via-[#0D0D12]/75 to-black/30" />
            </div>

            <div className="relative z-10 max-w-4xl">
              <div className="hero-badge inline-flex items-center space-x-2.5 px-3.5 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/15 mb-6">
                <span className="w-2 h-2 rounded-full bg-[#C9A84C] animate-ping" />
                <span className="font-mono text-[10px] tracking-widest text-[#FAF8F5]/90 uppercase">
                  StayPaid Atelier // Autumn-Winter Drop 01 Live
                </span>
              </div>

              <div className="mb-4">
                <h1 className="hero-title-sans font-sans font-extrabold uppercase text-3xl sm:text-5xl md:text-6xl lg:text-7xl tracking-tight text-white/95 leading-[1.05]">
                  Streetwear culture meets
                </h1>
                <div className="hero-title-serif font-serif italic text-5xl sm:text-6xl md:text-7xl lg:text-8xl xl:text-9xl text-[#C9A84C] tracking-tight leading-[0.95] mt-1 filter drop-shadow-[0_15px_25px_rgba(201,168,76,0.15)]">
                  Redefining Modern Luxury.
                </div>
              </div>

              <p className="hero-sub font-sans text-sm sm:text-base md:text-lg text-[#FAF8F5]/70 max-w-xl font-normal leading-relaxed mb-8">
                An independent fashion atelier engineering high-density 500GSM architectural silhouettes, raw selvedge craftsmanship, and zero-markup direct ordering.
              </p>

              <div className="hero-actions flex flex-wrap items-center gap-4">
                <a
                  href="#collection-section"
                  className="btn-magnetic btn-slide-hover px-8 py-4 rounded-full bg-[#C9A84C] text-[#0D0D12] font-bold text-xs sm:text-sm tracking-wider uppercase inline-flex items-center space-x-3 shadow-xl shadow-[#C9A84C]/25"
                >
                  <span className="slide-bg bg-white" />
                  <span className="relative z-10">Browse The Collection</span>
                  <span className="relative z-10">↗</span>
                </a>
                <a
                  href="#manifesto-section"
                  className="btn-magnetic px-7 py-4 rounded-full bg-white/5 hover:bg-white/10 border border-white/15 text-white font-medium text-xs sm:text-sm tracking-wider uppercase"
                >
                  Our Philosophy
                </a>
              </div>
            </div>
          </section>

          {/* FEATURES / ARTIFACTS */}
          <section id="features-section" className="py-28 px-6 md:px-16 max-w-7xl mx-auto">
            <div className="mb-16">
              <span className="font-mono text-xs uppercase tracking-widest text-[#C9A84C] block mb-2">// CORE PILLARS</span>
              <h2 className="font-sans font-bold text-3xl md:text-5xl text-white tracking-tight">
                Engineered for the Modern Discerning Wardrobe.
              </h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              {/* Card 1 */}
              <div className="feature-card bg-[#16161F] border border-white/10 rounded-[2.5rem] p-8 flex flex-col justify-between shadow-2xl">
                <div>
                  <span className="font-mono text-xs text-[#C9A84C] uppercase tracking-wider block mb-2">// ARTIFACT 01</span>
                  <h3 className="font-sans font-bold text-2xl text-white mb-2">Silhouette Diagnostic Shuffler</h3>
                  <p className="text-xs text-[#FAF8F5]/60 mb-6">Active cycle through our seasonal pattern drafts and trend resonance.</p>
                </div>
                <div className="relative h-56 w-full flex items-center justify-center my-4">
                  {shufflerCards.map((item, idx) => {
                    const offsets = [
                      { y: 0, scale: 1, zIndex: 30, opacity: 1 },
                      { y: 22, scale: 0.94, zIndex: 20, opacity: 0.65 },
                      { y: 44, scale: 0.88, zIndex: 10, opacity: 0.35 }
                    ];
                    const conf = offsets[idx];
                    return (
                      <div
                        key={item.id}
                        className="absolute w-[94%] bg-[#1E1E2B] border border-white/15 rounded-2xl p-5 transition-all duration-700 ease-[cubic-bezier(0.34,1.56,0.64,1)]"
                        style={{
                          transform: `translateY(${conf.y}px) scale(${conf.scale})`,
                          zIndex: conf.zIndex,
                          opacity: conf.opacity
                        }}
                      >
                        <div className="flex items-center justify-between text-[10px] font-mono text-[#C9A84C] mb-2">
                          <span>{item.batch}</span>
                          <span className="text-emerald-400 font-semibold">{item.resonance}</span>
                        </div>
                        <div className="font-sans font-bold text-sm text-white">{item.title}</div>
                        <div className="font-mono text-xs text-[#FAF8F5]/50 mt-1">{item.spec}</div>
                      </div>
                    );
                  })}
                </div>
                <div className="pt-4 border-t border-white/10 font-mono text-[11px] text-[#C9A84C]">AUTO-CYCLING 3.2S SPRING-BOUNCE</div>
              </div>

              {/* Card 2 */}
              <div className="feature-card bg-[#16161F] border border-white/10 rounded-[2.5rem] p-8 flex flex-col justify-between shadow-2xl">
                <div>
                  <span className="font-mono text-xs text-[#C9A84C] uppercase tracking-wider block mb-2">// ARTIFACT 02</span>
                  <h3 className="font-sans font-bold text-2xl text-white mb-2">Direct Pricing Telemetry</h3>
                  <p className="text-xs text-[#FAF8F5]/60 mb-6">Zero middleman markups. Live production cost transparency feed.</p>
                </div>
                <div className="bg-[#0D0D12] rounded-2xl border border-white/10 p-5 font-mono text-xs leading-relaxed text-[#FAF8F5]/85 min-h-[220px] flex flex-col justify-between my-2">
                  <div className="whitespace-pre-wrap">
                    {typewriterText}
                    <span className="inline-block w-2 h-4 bg-[#C9A84C] ml-1 animate-pulse" />
                  </div>
                </div>
                <div className="pt-4 border-t border-white/10 font-mono text-[11px] text-emerald-400">100% VALUE TRANSPARENCY VERIFIED</div>
              </div>

              {/* Card 3 */}
              <div className="feature-card bg-[#16161F] border border-white/10 rounded-[2.5rem] p-8 flex flex-col justify-between shadow-2xl">
                <div>
                  <span className="font-mono text-xs text-[#C9A84C] uppercase tracking-wider block mb-2">// ARTIFACT 03</span>
                  <h3 className="font-sans font-bold text-2xl text-white mb-2">1-Click Protocol Scheduler</h3>
                  <p className="text-xs text-[#FAF8F5]/60 mb-6">Weekly priority drop slots with automated reservation synchronization.</p>
                </div>
                <div className="bg-[#0D0D12] rounded-2xl border border-white/10 p-5 my-2 min-h-[220px] flex flex-col justify-between">
                  <div className="grid grid-cols-7 gap-1.5 my-3">
                    {daysOfWeek.map((day, idx) => (
                      <div
                        key={idx}
                        className={`h-12 rounded-xl flex flex-col items-center justify-center font-mono text-xs transition-all ${
                          idx === activeDayIndex ? 'bg-[#C9A84C] text-[#0D0D12] font-black scale-105' : 'bg-[#181824] text-[#FAF8F5]/60'
                        }`}
                      >
                        <span className="text-[10px]">{day}</span>
                        <span className="text-xs">{12 + idx}</span>
                      </div>
                    ))}
                  </div>
                  <div className={`w-full py-2.5 rounded-xl font-mono text-xs uppercase text-center transition-all ${isDaySaved ? 'bg-emerald-500 text-[#0D0D12] font-bold' : 'bg-white/10 text-white'}`}>
                    {isDaySaved ? '✓ Drop Slot Locked & Saved' : 'Confirming Drop Dispatch...'}
                  </div>
                </div>
                <div className="pt-4 border-t border-white/10 font-mono text-[11px] text-[#C9A84C]">EXPRESS WORLDWIDE DISPATCH SYNC</div>
              </div>
            </div>
          </section>

          {/* COLLECTION */}
          <section id="collection-section" className="py-24 px-6 md:px-16 max-w-7xl mx-auto border-t border-white/10">
            <div className="mb-16">
              <span className="font-mono text-xs uppercase tracking-widest text-[#C9A84C] block mb-2">// AUTUMN DROP 01</span>
              <h2 className="font-sans font-bold text-3xl md:text-5xl text-white tracking-tight">Curated Silhouette Release.</h2>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
              {PRODUCTS.map(product => {
                const currentSize = selectedSizes[product.id] || product.sizes[0];
                return (
                  <div key={product.id} className="bg-[#14141C] border border-white/10 rounded-[2rem] overflow-hidden flex flex-col justify-between group hover:border-[#C9A84C]/50 transition-all shadow-xl">
                    <div className="relative aspect-[3/4] overflow-hidden bg-[#1D1D28]">
                      <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                      <span className="absolute top-4 left-4 px-3 py-1 rounded-full bg-[#0D0D12]/80 backdrop-blur-md border border-white/10 font-mono text-[10px] text-[#C9A84C] uppercase">{product.tag}</span>
                      <span className="absolute bottom-4 right-4 px-3 py-1.5 rounded-full bg-[#0D0D12]/80 backdrop-blur-md border border-white/10 font-mono text-xs font-bold text-white">${product.price}.00</span>
                    </div>
                    <div className="p-6 flex flex-col flex-grow justify-between">
                      <div>
                        <span className="font-mono text-[10px] uppercase tracking-widest text-[#FAF8F5]/50">{product.category}</span>
                        <h3 className="font-sans font-bold text-base text-white mt-1 group-hover:text-[#C9A84C]">{product.name}</h3>
                        <p className="text-xs text-[#FAF8F5]/60 mt-2 line-clamp-2">{product.description}</p>
                      </div>
                      <div className="mt-6 pt-4 border-t border-white/10">
                        <div className="flex items-center justify-between mb-4">
                          <span className="font-mono text-[11px] text-[#FAF8F5]/60">Size:</span>
                          <div className="flex space-x-1.5">
                            {product.sizes.map(s => (
                              <button
                                key={s}
                                onClick={() => setSelectedSizes({ ...selectedSizes, [product.id]: s })}
                                className={`w-7 h-7 rounded-lg font-mono text-[11px] flex items-center justify-center ${currentSize === s ? 'bg-[#C9A84C] text-[#0D0D12] font-bold' : 'bg-white/5 text-[#FAF8F5]/70'}`}
                              >
                                {s}
                              </button>
                            ))}
                          </div>
                        </div>
                        <button
                          onClick={() => addToCart(product)}
                          className="btn-magnetic btn-slide-hover w-full py-3 rounded-full bg-white/10 hover:bg-[#C9A84C] text-white hover:text-[#0D0D12] font-bold text-xs tracking-wider uppercase flex items-center justify-center space-x-2"
                        >
                          <span className="slide-bg bg-[#C9A84C]" />
                          <span className="relative z-10">Add To Cart — ${product.price}</span>
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          {/* MANIFESTO */}
          <section id="manifesto-section" className="relative py-36 px-6 md:px-16 bg-[#09090E] border-y border-white/10 text-center">
            <div className="relative z-10 max-w-5xl mx-auto flex flex-col items-center">
              <span className="font-mono text-xs uppercase tracking-widest text-[#C9A84C] mb-6">// THE MANIFESTO</span>
              <p className="manifesto-reveal font-sans text-lg sm:text-2xl text-[#FAF8F5]/50 max-w-3xl leading-relaxed mb-6">
                Most fashion retailers focus on: hyper-disposable seasonal micro-trends, flimsy synthetic blends, and 700% middleman markups that fund hollow marketing spectacles.
              </p>
              <div className="w-16 h-[1px] bg-[#C9A84C]/40 my-6" />
              <h2 className="manifesto-reveal font-serif italic text-4xl sm:text-6xl md:text-7xl lg:text-8xl text-white tracking-tight leading-[1.08] max-w-4xl">
                We focus on: heavy-gauge architectural silhouettes, <span className="text-[#C9A84C] underline decoration-[#C9A84C]/40">uncompromising</span> textile integrity, and radical direct pricing.
              </h2>
            </div>
          </section>

          {/* PROTOCOL */}
          <section id="protocol-section" className="py-24 px-6 md:px-16 max-w-6xl mx-auto">
            <div className="mb-20 text-center">
              <span className="font-mono text-xs uppercase tracking-widest text-[#C9A84C]">// EXECUTION METHODOLOGY</span>
              <h2 className="font-sans font-bold text-3xl md:text-5xl text-white tracking-tight mt-2">The Three-Step Production Protocol.</h2>
            </div>
            <div className="space-y-16">
              {/* Step 1 */}
              <div className="protocol-stack-card sticky top-28 bg-[#161622] border border-white/15 rounded-[3rem] p-8 md:p-14 shadow-2xl flex flex-col lg:flex-row items-center justify-between gap-10">
                <div className="max-w-md">
                  <span className="font-mono text-sm text-[#C9A84C] tracking-widest block mb-3">// PROTOCOL STEP 01</span>
                  <h3 className="font-sans font-bold text-3xl md:text-4xl text-white mb-4">Architectural Pattern Engineering</h3>
                  <p className="text-sm text-[#FAF8F5]/70 leading-relaxed">Each silhouette is drafted digitally using stress-tension modeling to guarantee an effortless, weighted drop without fabric sag.</p>
                </div>
                <div className="w-64 h-64 flex items-center justify-center">
                  <svg className="w-full h-full animate-[spin_24s_linear_infinite]" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="80" fill="none" stroke="#C9A84C" strokeWidth="1.5" strokeDasharray="6 3" />
                    <circle cx="100" cy="100" r="50" fill="none" stroke="#FAF8F5" strokeWidth="1" opacity="0.4" />
                    <polygon points="100,30 170,140 30,140" fill="none" stroke="#C9A84C" strokeWidth="1" opacity="0.6" />
                    <circle cx="100" cy="100" r="6" fill="#C9A84C" />
                  </svg>
                </div>
              </div>
              {/* Step 2 */}
              <div className="protocol-stack-card sticky top-28 bg-[#1B1B28] border border-white/15 rounded-[3rem] p-8 md:p-14 shadow-2xl flex flex-col lg:flex-row items-center justify-between gap-10">
                <div className="max-w-md">
                  <span className="font-mono text-sm text-[#C9A84C] tracking-widest block mb-3">// PROTOCOL STEP 02</span>
                  <h3 className="font-sans font-bold text-3xl md:text-4xl text-white mb-4">Raw Mill Extraction & Quality Scan</h3>
                  <p className="text-sm text-[#FAF8F5]/70 leading-relaxed">We test every roll of 500GSM long-staple cotton for yarn density, colorfastness, and pre-shrunk equilibrium under high-temperature steam.</p>
                </div>
                <div className="w-64 h-64 bg-[#0D0D12] rounded-3xl border border-white/10 p-6 flex flex-col justify-between">
                  <div className="grid grid-cols-6 gap-3">
                    {Array.from({ length: 36 }).map((_, i) => (
                      <div key={i} className="w-2.5 h-2.5 rounded-full bg-white/20 mx-auto" />
                    ))}
                  </div>
                  <div className="text-[10px] font-mono text-[#C9A84C] text-center">PASSED 100% OPTICAL SCAN</div>
                </div>
              </div>
              {/* Step 3 */}
              <div className="protocol-stack-card sticky top-28 bg-[#14141E] border border-[#C9A84C]/30 rounded-[3rem] p-8 md:p-14 shadow-2xl flex flex-col lg:flex-row items-center justify-between gap-10">
                <div className="max-w-md">
                  <span className="font-mono text-sm text-[#C9A84C] tracking-widest block mb-3">// PROTOCOL STEP 03</span>
                  <h3 className="font-sans font-bold text-3xl md:text-4xl text-white mb-4">Cold-Seal Worldwide Fulfillment</h3>
                  <p className="text-sm text-[#FAF8F5]/70 leading-relaxed">Each unit is vacuum-sealed with humidity buffers and serialized tamper tape before being expedited via global carbon-offset air freight.</p>
                </div>
                <div className="w-64 h-64 bg-[#0D0D12] rounded-3xl border border-white/10 p-6 flex flex-col justify-between">
                  <div className="font-mono text-[11px] text-[#C9A84C]">DISPATCH TELEMETRY ACTIVE</div>
                  <svg className="w-full h-24" viewBox="0 0 240 80">
                    <path d="M0,40 L40,40 L50,15 L60,65 L70,30 L80,50 L90,40 L140,40 L150,10 L160,70 L170,25 L180,55 L190,40 L240,40" fill="none" stroke="#C9A84C" strokeWidth="2.5" />
                  </svg>
                  <div className="text-[10px] font-mono text-emerald-400 text-center">FULFILLMENT SPEED: 24.2H</div>
                </div>
              </div>
            </div>
          </section>

          {/* MEMBERSHIP */}
          <section id="membership-section" className="py-28 px-6 md:px-16 max-w-6xl mx-auto border-t border-white/10">
            <div className="text-center mb-16">
              <span className="font-mono text-xs uppercase tracking-widest text-[#C9A84C]">// ACCESS TIERS</span>
              <h2 className="font-sans font-bold text-3xl md:text-5xl text-white tracking-tight mt-2">Choose Your Access Protocol.</h2>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 items-center">
              <div className="bg-[#14141C] border border-white/10 rounded-[2.5rem] p-8 flex flex-col justify-between h-full">
                <div>
                  <span className="font-mono text-xs text-[#FAF8F5]/50 uppercase">Public Tier</span>
                  <h3 className="font-sans font-bold text-2xl text-white mt-1">Essential</h3>
                  <div className="my-6"><span className="text-4xl font-bold text-white">$0</span><span className="text-xs font-mono text-[#FAF8F5]/50 ml-1">/ Free</span></div>
                  <p className="text-xs text-[#FAF8F5]/70">Open public drop access with standard ground delivery.</p>
                </div>
                <a href="#collection-section" className="mt-8 w-full py-3 rounded-full bg-white/5 border border-white/15 text-white font-mono text-xs tracking-wider uppercase text-center block">Browse Public Drop</a>
              </div>

              <div className="bg-[#1A1A26] border-2 border-[#C9A84C] rounded-[2.5rem] p-9 flex flex-col justify-between shadow-2xl scale-105 z-10">
                <div>
                  <span className="font-mono text-xs text-[#C9A84C] uppercase">Priority Syndicate</span>
                  <h3 className="font-sans font-bold text-3xl text-white mt-1">Syndicate Pass</h3>
                  <div className="my-6"><span className="text-5xl font-extrabold text-white">$29</span><span className="text-xs font-mono text-[#FAF8F5]/50 ml-1">/ Quarter</span></div>
                  <p className="text-xs text-[#FAF8F5]/80"><strong>15-Minute Priority Early Access</strong> to all 150-piece numbered capsule releases.</p>
                </div>
                <button onClick={() => alert('Syndicate Pass priority window applied to your session!')} className="btn-magnetic btn-slide-hover mt-8 w-full py-3.5 rounded-full bg-[#C9A84C] text-[#0D0D12] font-bold text-xs tracking-wider uppercase">
                  <span className="slide-bg bg-white" />
                  <span className="relative z-10">Claim Syndicate Access ↗</span>
                </button>
              </div>

              <div className="bg-[#14141C] border border-white/10 rounded-[2.5rem] p-8 flex flex-col justify-between h-full">
                <div>
                  <span className="font-mono text-xs text-[#FAF8F5]/50 uppercase">Private Client</span>
                  <h3 className="font-sans font-bold text-2xl text-white mt-1">Atelier Bespoke</h3>
                  <div className="my-6"><span className="text-4xl font-bold text-white">$180</span><span className="text-xs font-mono text-[#FAF8F5]/50 ml-1">/ Year</span></div>
                  <p className="text-xs text-[#FAF8F5]/70">Custom tailored hems, 1-of-50 serialized silver tags, and concierge line.</p>
                </div>
                <button onClick={() => alert('Private Client Concierge will contact you within 2 hours.')} className="mt-8 w-full py-3 rounded-full bg-white/5 border border-white/15 text-white font-mono text-xs tracking-wider uppercase">Contact Concierge</button>
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-[#09090E] border-t border-white/10 rounded-t-[4rem] pt-20 pb-12 px-6 md:px-16 text-[#FAF8F5]">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">
              <div className="flex items-center space-x-2.5">
                <img
                  src="logo.jpg"
                  alt="StayPaid Logo"
                  className="w-10 h-10 rounded-full object-cover border border-[#C9A84C]/40 shadow-lg"
                />
                <span className="font-sans font-black tracking-tight text-lg uppercase text-white">
                  STAYPAID MERCH
                </span>
              </div>
              <div className="font-mono text-xs text-[#FAF8F5]/40">
                © STAYPAID MERCH CORP. ALL RIGHTS RESERVED.
              </div>
              <div className="inline-flex items-center space-x-3 px-4 py-2 rounded-full bg-[#161622] border border-white/10">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" />
                <span className="font-mono text-[11px] text-[#FAF8F5]/90">
                  SYSTEM OPERATIONAL // LOGISTICS ACTIVE // 24.2H DISPATCH
                </span>
              </div>
            </div>
          </footer>

          {/* CART DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={() => setIsCartOpen(false)} />
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-[#12121A] border-l border-white/15 p-6 flex flex-col justify-between shadow-2xl">
                  <div>
                    <div className="flex items-center justify-between pb-6 border-b border-white/10">
                      <h3 className="font-sans font-bold text-lg text-white">Your Order Queue</h3>
                      <button onClick={() => setIsCartOpen(false)} className="text-[#FAF8F5]/60 hover:text-white">✕</button>
                    </div>
                    <div className="py-6 space-y-4 max-h-[55vh] overflow-y-auto">
                      {cart.length === 0 ? (
                        <div className="text-center py-12 text-xs font-mono text-[#FAF8F5]/50">Your cart is currently empty.</div>
                      ) : (
                        cart.map((item, idx) => (
                          <div key={`${item.id}-${item.size}`} className="bg-[#1A1A26] rounded-2xl p-4 border border-white/10 flex items-center justify-between">
                            <img src={item.image} alt={item.name} className="w-16 h-16 rounded-xl object-cover" />
                            <div className="flex-1 px-4">
                              <h4 className="font-sans font-bold text-xs text-white line-clamp-1">{item.name}</h4>
                              <span className="font-mono text-[10px] text-[#C9A84C]">Size: {item.size} • ${item.price}</span>
                              <div className="flex items-center space-x-2 mt-2">
                                <button onClick={() => updateQuantity(idx, -1)} className="w-5 h-5 rounded bg-white/10 text-xs">-</button>
                                <span className="font-mono text-xs">{item.quantity}</span>
                                <button onClick={() => updateQuantity(idx, 1)} className="w-5 h-5 rounded bg-white/10 text-xs">+</button>
                              </div>
                            </div>
                            <div className="font-mono text-xs font-bold">${item.price * item.quantity}</div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  {cart.length > 0 && (
                    <div className="pt-6 border-t border-white/10 space-y-4">
                      <div className="flex justify-between font-bold text-sm text-white">
                        <span>Total</span>
                        <span className="text-[#C9A84C]">${cartTotal}.00</span>
                      </div>
                      <button
                        onClick={() => {
                          setIsCartOpen(false);
                          setOrderModalOpen(true);
                          setOrderSuccess(false);
                          setTimeout(() => setOrderSuccess(true), 1600);
                        }}
                        className="btn-magnetic btn-slide-hover w-full py-4 rounded-full bg-[#C9A84C] text-[#0D0D12] font-bold text-xs uppercase"
                      >
                        <span className="slide-bg bg-white" />
                        <span className="relative z-10">Place Online Order Now ↗</span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ORDER SUCCESS MODAL */}
          {orderModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setOrderModalOpen(false)} />
              <div className="relative bg-[#161622] border border-[#C9A84C]/40 rounded-[2.5rem] p-8 max-w-lg w-full shadow-2xl text-center z-10">
                {!orderSuccess ? (
                  <div className="py-8 space-y-4">
                    <div className="w-12 h-12 rounded-full border-2 border-[#C9A84C] border-t-transparent animate-spin mx-auto" />
                    <h3 className="font-sans font-bold text-xl text-white">Transmitting Order Telemetry...</h3>
                  </div>
                ) : (
                  <div className="py-4 space-y-6">
                    <div className="w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center mx-auto text-emerald-400 text-2xl font-bold">✓</div>
                    <div>
                      <span className="font-mono text-xs text-[#C9A84C] uppercase tracking-widest">// ORDER CONFIRMED</span>
                      <h3 className="font-sans font-bold text-2xl text-white mt-1">StayPaid Order #SP-{Math.floor(100000 + Math.random() * 900000)}</h3>
                      <p className="text-xs text-[#FAF8F5]/70 mt-2">Your garments from Autumn-Winter Drop 01 have been secured.</p>
                    </div>
                    <button
                      onClick={() => { setOrderModalOpen(false); setCart([]); }}
                      className="btn-magnetic w-full py-3.5 rounded-full bg-[#C9A84C] text-[#0D0D12] font-bold text-xs uppercase tracking-wider"
                    >
                      Return To Showroom
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
